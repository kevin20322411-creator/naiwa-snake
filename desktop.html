<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ddfa79"><meta name="description" content="360度奶蛙贪吃蛇，无尽任务、32个开饭关卡、大地图和奶蛙语音。"><title>贪吃奶娃 · 自由开饭</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f7ed38'/%3E%3Ccircle cx='11' cy='13' r='3' fill='%231c231d'/%3E%3Ccircle cx='21' cy='13' r='3' fill='%231c231d'/%3E%3Cpath d='M9 21h14' stroke='%231c231d' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="arena.css?v=16"></head>
<body data-mode="desktop"><main class="arena-app">
<header class="topbar"><div class="brand"><span class="brand-mark">N</span><h1>贪吃奶娃</h1><nav class="versions" aria-label="试玩版本"><a id="mobile-link" href="mobile.html">手机</a><a id="desktop-link" href="desktop.html">电脑</a></nav></div><div class="audio-controls"><button id="music" aria-label="关闭背景音乐" aria-pressed="true">♫ 音乐</button><button id="sound" aria-label="关闭奶蛙音效" aria-pressed="true">语音</button><button id="audio-test" aria-label="试听音乐和奶蛙语音">🔊 试听</button><button id="fullscreen" hidden>全屏</button></div></header>
<section id="scoreboard" class="hud" aria-label="游戏成绩"><div class="score"><span>本局</span><strong id="score">000</strong></div><div class="crew"><strong id="length">5</strong><span>只奶蛙</span></div><div class="record"><span>最高</span><strong id="best">000</strong></div><button id="menu" aria-label="选择游戏模式">模式</button><button id="pause" disabled aria-label="暂停游戏">暂停</button></section>
<section class="board-wrap" id="board-wrap" aria-label="奶蛙大地图"><canvas id="game" tabindex="0" aria-label="360度奶蛙游戏，手机拖动摇杆，电脑移动鼠标转向"></canvas>
<div id="level-controls" class="level-controls" hidden><button id="level-menu" aria-label="选择游戏模式">模式</button><button id="level-pause" aria-label="暂停游戏" disabled>暂停</button></div><div class="mission-panel"><div><span class="mission-label" id="mission-label">无尽任务</span><strong id="mission-text">第 1 档 · 尝一口</strong></div><div id="goal-list" class="objective-list"></div><span class="mission-reward" id="mission-reward">奖励 +40 分 / 能量 +20</span><div class="mission-track"><span id="mission-progress"></span></div><span class="defeated" id="defeated">已击败 0 只电脑蛙</span></div><div class="minimap"><canvas id="minimap" width="112" height="112" aria-label="地图位置"></canvas><span>大地图 · 你在这里</span></div><div id="buffs" class="buffs" aria-live="polite"></div><div id="boundary" class="boundary" hidden>快到边界了，转个弯</div><div class="zone-label" id="zone-label">开饭广场</div>
<div class="touch-controls" id="touch-controls"><div class="joystick" id="joystick" role="group" aria-label="360度虚拟摇杆"><div class="stick-ring"></div><div class="stick-knob" id="stick-knob"></div><span>拖动转向</span></div><div class="boost-wrap"><button id="boost" aria-label="按住加速">加速<span>按住冲刺</span></button><div class="energy-track"><span id="energy"></span></div></div></div><div class="desktop-tip" id="desktop-tip">移动鼠标转向 · 按住鼠标 / Shift 加速 · 空格暂停</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay"><div class="start-card"><div class="hero-portrait"><img src="assets/frog.png" alt="黄色圆胖奶蛙" id="hero-frog"><video id="death-emoji" class="death-emoji" src="assets/death-laugh.mp4" muted playsinline preload="auto" aria-label="捧腹大笑的奶龙动态表情" hidden></video></div><span id="overlay-kicker" class="card-kicker">360° 自由移动 / 大地图</span><h2 id="overlay-title">今天怎么开饭？</h2><p id="overlay-text">选一种玩法，带着奶蛙队抢蛋。</p><div id="mode-setup" class="mode-setup"><div class="mode-picker" aria-label="游戏模式"><button id="mode-endless" aria-pressed="true">∞ 无尽模式</button><button id="mode-levels" aria-pressed="false">🏁 关卡模式</button></div><div id="level-chapters" class="level-chapters" aria-label="选择章节" hidden></div><div id="level-progress" class="level-progress" hidden></div><div id="level-list" class="level-list" tabindex="0" aria-label="选择关卡" hidden></div><div id="mode-details" class="mode-details"></div></div><div class="start-features" id="start-features"><span>🧲 吸奶蛋</span><span>🛡️ 挡一次碰撞</span><span>⚡ 加速</span></div><div id="result" class="result" hidden></div><button id="start" class="primary-button">开始开饭</button><div class="result-actions" id="result-actions" hidden><button id="replay-level" hidden>再玩本关</button><button id="choose-mode">换模式 / 选关</button></div><span id="overlay-hint" class="start-hint">拖动左下摇杆转向 · 右下按住加速<br>引导电脑的头撞你的身体，击败掉金蛋</span><span id="audio-status" class="audio-status" role="status">点击开始开启声音 · 顶部可试听</span></div></div>
</section><footer class="bottom-bar"><span id="status-text">吃一口，多一蛙。</span><span id="time">00:00</span><span>头撞墙、自己或电脑身体会结束</span></footer></main><script src="arena-engine.js?v=16"></script><script src="arena.js?v=16"></script></body></html>
